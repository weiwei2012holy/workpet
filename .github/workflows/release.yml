name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal / DMG / Zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and Package Application
        env:
          GOFLAGS: "-ldflags=-X=workpet/pkg/version.Version=${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
        run: |
          wails3 package

      - name: Create macOS Release Archive
        run: |
          cd bin
          ls -la
          if [ -d "workpet.app" ]; then
            zip -r -y ../workpet-darwin-universal.zip workpet.app
            cp ../workpet-darwin-universal.zip ../workpet-macOS.zip
          elif compgen -G "*.app" > /dev/null; then
            zip -r -y ../workpet-darwin-universal.zip *.app
            cp ../workpet-darwin-universal.zip ../workpet-macOS.zip
          else
            chmod +x workpet*
            zip -y ../workpet-darwin-universal.zip workpet*
            cp ../workpet-darwin-universal.zip ../workpet-macOS.zip
          fi
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workpet-macOS
          path: |
            workpet-darwin-universal.zip
            workpet-macOS.zip
          retention-days: 7

  build-windows:
    name: Build Windows (x64 exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Application
        env:
          GOFLAGS: "-ldflags=-X=workpet/pkg/version.Version=${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
        run: |
          wails3 build -tags "production"

      - name: Create Windows Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path bin/workpet.exe -DestinationPath workpet-windows-amd64.zip
          Copy-Item workpet-windows-amd64.zip -Destination workpet-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            workpet-windows-amd64.zip
            workpet-windows-x64.zip
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: workpet-macOS
          path: ./release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: workpet-windows
          path: ./release-assets

      - name: Generate Checksums
        run: |
          cd ./release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/workpet-darwin-universal.zip
            ./release-assets/workpet-macOS.zip
            ./release-assets/workpet-windows-amd64.zip
            ./release-assets/workpet-windows-x64.zip
            ./release-assets/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
